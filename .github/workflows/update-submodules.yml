name: Update vendor submodules

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Identity must be set BEFORE any operation that can create a commit.
      # `git submodule update --remote --merge` used to fail here with
      # "Committer identity unknown" because the merge inside vendor/ruvector
      # needs an author when the pinned commit isn't a fast-forward of upstream.
      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Use a plain `--remote` checkout (detached HEAD at each submodule's
      # configured `branch` tip from .gitmodules) rather than `--merge`. We only
      # want to bump the superproject's gitlink to the latest upstream commit;
      # there's no reason to create merge commits inside the vendored repos, and
      # `--merge` breaks whenever the current pin has diverged from that branch.
      - name: Update submodules to latest tracked branch
        run: |
          git submodule sync --recursive
          git submodule update --remote --recursive

      - name: Check for changes
        id: check
        run: |
          mapfile -t SUBMODULE_PATHS < <(
            git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'
          )
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "--- submodule pointer changes ---"
            git submodule status --recursive || true
            git diff --submodule=log -- "${SUBMODULE_PATHS[@]}" || true
          fi

      - name: Create PR with updates
        if: steps.check.outputs.changed == 'true'
        run: |
          BRANCH="chore/update-submodules"
          mapfile -t SUBMODULE_PATHS < <(
            git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'
          )
          git checkout -B "$BRANCH"
          git add -- "${SUBMODULE_PATHS[@]}"
          git commit -m "chore: update vendor submodules to latest upstream"
          git push --force-with-lease origin "$BRANCH"

          EXISTING_PR_URL="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$EXISTING_PR_URL" ]; then
            echo "Updated existing PR: $EXISTING_PR_URL"
            exit 0
          fi

          PR_CREATE_OUTPUT="$(
            gh pr create \
              --title "chore: update vendor submodules" \
              --body "Automated submodule update to the latest upstream commit on each submodule's tracked branch (see \`.gitmodules\`). Review the pointer diff before merging." \
              --base main \
              --head "$BRANCH" \
              2>&1
          )" && {
            echo "$PR_CREATE_OUTPUT"
            exit 0
          }

          echo "$PR_CREATE_OUTPUT"
          if ! printf '%s' "$PR_CREATE_OUTPUT" | grep -Fq "GitHub Actions is not permitted to create or approve pull requests"; then
            exit 1
          fi

          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          echo "::warning::GitHub Actions cannot create pull requests with this repository's GITHUB_TOKEN. The update branch was pushed successfully; open a PR manually at ${COMPARE_URL}"
          {
            echo "### Submodule update branch ready"
            echo
            echo "GitHub Actions pushed the update branch successfully, but repository settings blocked pull request creation with \`GITHUB_TOKEN\`."
            echo
            echo "- Branch: \`$BRANCH\`"
            echo "- Manual PR URL: ${COMPARE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
